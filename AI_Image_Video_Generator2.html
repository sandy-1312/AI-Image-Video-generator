<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Video Generator UI</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: "Poppins", sans-serif;
    }

    body{
        min-height:100vh;
        background: linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#111827 100%);
        overflow:hidden;
        display:flex;
        justify-content:center;
        align-items:center;
        color:white;
        position:relative;
    }

    /* Enhanced animated background */
    body::before{
        content:'';
        position:fixed;
        width:600px;
        height:600px;
        background:radial-gradient(circle, rgba(0,255,255,0.2) 0%, rgba(0,255,255,0.05) 70%);
        border-radius:50%;
        filter:blur(120px);
        top:-200px;
        left:-150px;
        animation: float1 15s ease-in-out infinite alternate;
        z-index:1;
    }

    body::after{
        content:'';
        position:fixed;
        width:550px;
        height:550px;
        background:radial-gradient(circle, rgba(255,0,200,0.15) 0%, rgba(255,0,200,0.02) 70%);
        border-radius:50%;
        filter:blur(120px);
        bottom:-200px;
        right:-150px;
        animation: float2 20s ease-in-out infinite alternate;
        z-index:1;
    }

    @keyframes float1{
        from{
            transform: translateY(0px) scale(1);
        }
        to{
            transform: translateY(60px) scale(1.1);
        }
    }

    @keyframes float2{
        from{
            transform: translateY(0px) scale(1);
        }
        to{
            transform: translateY(-60px) scale(0.95);
        }
    }

    .container{
        position:relative;
        z-index:10;
        width:95%;
        max-width:1200px;
        background:rgba(15,23,42,0.4);
        border:1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border-radius:40px;
        padding:50px;
        box-shadow:
            0 25px 50px rgba(0,0,0,0.3),
            inset 0 1px 0 rgba(255,255,255,0.1);
        animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp{
        from{
            opacity:0;
            transform: translateY(40px);
        }
        to{
            opacity:1;
            transform: translateY(0);
        }
    }

    .top{
        display:flex;
        justify-content:space-between;
        align-items:stretch;
        gap:50px;
        flex-wrap:wrap;
    }

    .left{
        flex:1;
        min-width:280px;
        display:flex;
        flex-direction:column;
        justify-content:center;
    }

    .title{
        font-size:3.5rem;
        line-height:1.15;
        font-weight:800;
        margin-bottom:20px;
        letter-spacing:-1.5px;
        animation: titleGlow 2s ease-in-out;
    }

    @keyframes titleGlow{
        0%{
            opacity:0;
            transform: translateY(20px);
        }
        100%{
            opacity:1;
            transform: translateY(0);
        }
    }

    .title span{
        background: linear-gradient(120deg,#00f7ff,#0097ff,#ff00d4,#00f7ff);
        background-size: 300% 300%;
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        background-clip:text;
        animation: gradientShift 6s ease infinite;
    }

    @keyframes gradientShift{
        0%{
            background-position: 0% 50%;
        }
        50%{
            background-position: 100% 50%;
        }
        100%{
            background-position: 0% 50%;
        }
    }

    .desc{
        color:#cbd5e1;
        line-height:1.8;
        margin-bottom:35px;
        max-width:550px;
        font-size:1.05rem;
        animation: descFade 1s ease 0.2s both;
    }

    @keyframes descFade{
        from{
            opacity:0;
            transform: translateX(-20px);
        }
        to{
            opacity:1;
            transform: translateX(0);
        }
    }

    .prompt-box{
        display:flex;
        gap:12px;
        flex-wrap:wrap;
        animation: boxSlide 1s ease 0.4s both;
    }

    @keyframes boxSlide{
        from{
            opacity:0;
            transform: translateY(20px);
        }
        to{
            opacity:1;
            transform: translateY(0);
        }
    }

    input{
        flex:1;
        min-width:240px;
        padding:16px 24px;
        border:2px solid rgba(255,255,255,0.1);
        border-radius:18px;
        outline:none;
        background:rgba(255,255,255,0.06);
        color:white;
        font-size:1rem;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        font-weight:500;
    }

    input::placeholder{
        color: rgba(203,213,225,0.6);
    }

    input:focus{
        background:rgba(255,255,255,0.12);
        border-color:rgba(0,247,255,0.5);
        box-shadow: 
            0 0 20px rgba(0,247,255,0.2),
            inset 0 0 10px rgba(0,247,255,0.05);
        transform: translateY(-2px);
    }

    input:hover:not(:focus){
        background:rgba(255,255,255,0.09);
        border-color:rgba(0,247,255,0.3);
    }

    button{
        padding:16px 40px;
        border:2px solid transparent;
        border-radius:18px;
        background: linear-gradient(135deg,#00f7ff,#0097ff);
        color:white;
        font-size:1rem;
        cursor:pointer;
        font-weight:700;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        letter-spacing:0.5px;
        position:relative;
        overflow:hidden;
        white-space:nowrap;
    }

    button::before{
        content:'';
        position:absolute;
        top:0;
        left:-100%;
        width:100%;
        height:100%;
        background: linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
        transition: left 0.6s ease;
    }

    button:hover{
        transform: translateY(-4px) scale(1.05);
        box-shadow: 
            0 15px 35px rgba(0,247,255,0.3),
            0 0 20px rgba(0,247,255,0.2);
        border-color:rgba(0,247,255,0.5);
    }

    button:hover::before{
        left:100%;
    }

    button:active{
        transform: translateY(-2px) scale(1.02);
    }

    button:disabled{
        opacity:0.6;
        cursor:not-allowed;
        transform:none;
    }

    .right{
        width:360px;
        height:480px;
        border-radius:30px;
        overflow:hidden;
        position:relative;
        background:#111827;
        box-shadow:
            0 20px 60px rgba(0,0,0,0.5),
            0 0 40px rgba(0,247,255,0.1);
        border:1px solid rgba(0,247,255,0.2);
        animation: previewSlide 1s ease 0.6s both;
    }

    @keyframes previewSlide{
        from{
            opacity:0;
            transform: translateX(40px);
        }
        to{
            opacity:1;
            transform: translateX(0);
        }
    }

    .preview-wrapper{
        width:100%;
        height:100%;
        position:relative;
    }

    .preview{
        width:100%;
        height:100%;
        object-fit:cover;
        opacity:0;
        transition: opacity 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        position:absolute;
        filter: brightness(1.1);
    }

    .preview.active{
        opacity:1;
    }

    .overlay{
        position:absolute;
        inset:0;
        background: linear-gradient(180deg,
            rgba(0,0,0,0) 0%,
            rgba(0,0,0,0.2) 40%,
            rgba(0,0,0,0.7) 100%
        );
        z-index:2;
    }

    .video-text{
        position:absolute;
        bottom:0;
        left:0;
        right:0;
        z-index:3;
        padding:30px;
        animation: textSlideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes textSlideUp{
        from{
            transform: translateY(20px);
            opacity:0;
        }
        to{
            transform: translateY(0);
            opacity:1;
        }
    }

    .video-text h3{
        font-size:1.6rem;
        margin-bottom:8px;
        font-weight:700;
        letter-spacing:-0.5px;
        word-break:break-word;
    }

    .video-text p{
        color:#cbd5e1;
        font-size:0.95rem;
        font-weight:500;
        letter-spacing:0.3px;
    }

    .loader{
        margin-top:30px;
        display:none;
        align-items:center;
        gap:12px;
        color:#cbd5e1;
        animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn{
        from{
            opacity:0;
        }
        to{
            opacity:1;
        }
    }

    .dot{
        width:12px;
        height:12px;
        border-radius:50%;
        background: linear-gradient(135deg,#00f7ff,#0097ff);
        animation: pulse 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        box-shadow: 0 0 12px rgba(0,247,255,0.6);
    }

    .dot:nth-child(2){
        animation-delay:0.2s;
    }

    .dot:nth-child(3){
        animation-delay:0.4s;
    }

    @keyframes pulse{
        0%, 100%{
            transform: scale(1);
            opacity:0.4;
        }
        50%{
            transform: scale(1.3);
            opacity:1;
        }
    }

    .loader span{
        font-weight:600;
        letter-spacing:0.5px;
        animation: shimmer 2s ease-in-out infinite;
    }

    @keyframes shimmer{
        0%, 100%{
            opacity:0.7;
        }
        50%{
            opacity:1;
        }
    }

    .success-indicator{
        display:none;
        align-items:center;
        gap:8px;
        color:#10b981;
        margin-top:15px;
        font-weight:600;
        animation: slideIn 0.5s ease;
    }

    @keyframes slideIn{
        from{
            opacity:0;
            transform: translateX(-20px);
        }
        to{
            opacity:1;
            transform: translateX(0);
        }
    }

    .success-indicator::before{
        content:'✓';
        display:flex;
        align-items:center;
        justify-content:center;
        width:24px;
        height:24px;
        border-radius:50%;
        background:rgba(16,185,129,0.2);
        font-weight:700;
    }

    @media(max-width:950px){
        .top{
            flex-direction:column;
            gap:40px;
        }

        .right{
            width:100%;
            max-width:400px;
            margin:0 auto;
        }

        .container{
            padding:40px;
        }

        .title{
            font-size:2.8rem;
        }
    }

    @media(max-width:640px){
        .container{
            padding:30px 20px;
            border-radius:30px;
        }

        .title{
            font-size:2rem;
        }

        .desc{
            font-size:0.95rem;
        }

        .right{
            height:400px;
            max-width:100%;
        }

        .prompt-box{
            flex-direction:column;
        }

        input, button{
            width:100%;
        }

        .top{
            gap:25px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="top">

        <div class="left">
            <h1 class="title">
                AI <span>Video Generator</span>
            </h1>

            <p class="desc">
                Transform your imagination into stunning AI-generated cinematic videos. Experience seamless transitions, beautiful animations, and professional-quality previews in real-time.
            </p>

            <div class="prompt-box">
                <input type="text" id="prompt" placeholder="Describe your dream video..." maxlength="100" />
                <button id="genBtn" onclick="generateVideo()">
                    Generate
                </button>
            </div>

            <div class="loader" id="loader">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <span>Generating cinematic magic...</span>
            </div>

            <div class="success-indicator" id="successIndicator">
                Video generated successfully!
            </div>
        </div>

        <div class="right">
            <div class="preview-wrapper">
                <img class="preview active"
                src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop"
                alt="Beach sunset preview"
                />

                <img class="preview"
                src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?q=80&w=1200&auto=format&fit=crop"
                alt="Mountain landscape preview"
                />

                <img class="preview"
                src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=1200&auto=format&fit=crop"
                alt="Ocean waves preview"
                />

                <div class="overlay"></div>

                <div class="video-text">
                    <h3 id="videoTitle">Nature Escape</h3>
                    <p>AI Cinematic Preview</p>
                </div>
            </div>
        </div>

    </div>

</div>

<script>
    const previews = document.querySelectorAll(".preview");
    const loader = document.getElementById("loader");
    const videoTitle = document.getElementById("videoTitle");
    const genBtn = document.getElementById("genBtn");
    const promptInput = document.getElementById("prompt");
    const successIndicator = document.getElementById("successIndicator");

    let current = 0;
    let autoSlide;
    let isGenerating = false;

    function startSlides(){
        autoSlide = setInterval(() => {
            previews[current].classList.remove("active");
            current = (current + 1) % previews.length;
            previews[current].classList.add("active");
        }, 4000);
    }

    startSlides();

    function generateVideo(){
        const prompt = promptInput.value.trim();

        if(prompt === ""){
            promptInput.focus();
            promptInput.style.border = "2px solid rgba(239, 68, 68, 0.5)";
            setTimeout(() => {
                promptInput.style.border = "2px solid rgba(255,255,255,0.1)";
            }, 1500);
            return;
        }

        if(isGenerating) return;

        isGenerating = true;
        genBtn.disabled = true;
        loader.style.display = "flex";
        successIndicator.style.display = "none";
        clearInterval(autoSlide);

        videoTitle.innerText = "Processing...";
        videoTitle.style.opacity = "0.7";

        setTimeout(() => {
            loader.style.display = "none";
            videoTitle.innerText = prompt;
            videoTitle.style.opacity = "1";
            successIndicator.style.display = "flex";
            
            startSlides();

            setTimeout(() => {
                successIndicator.style.display = "none";
                isGenerating = false;
                genBtn.disabled = false;
            }, 3000);

        }, 3500);
    }

    // Allow Enter key to generate
    promptInput.addEventListener("keypress", (e) => {
        if(e.key === "Enter" && !isGenerating){
            generateVideo();
        }
    });

    // Clear error styling on focus
    promptInput.addEventListener("focus", () => {
        promptInput.style.border = "2px solid rgba(255,255,255,0.1)";
    });

</script>

</body>
</html>
